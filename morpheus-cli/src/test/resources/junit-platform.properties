# JUnit runs the tests of this module in parallel, classes and methods alike (ADR-0115).
# Possible since the connection scope counts on the recorder its opener names, and since every test that sets the
# default locale or a system property is @Isolated (TestsThatMutateTheJvmAreIsolatedArchitectureTest).
# A test added here that reads a static of the process, or shares state between its methods, breaks it.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.mode.classes.default=concurrent
# A fixed pool, so that a race a laptop with two cores hides is not left to a runner with sixteen to find: the
# parallelism would otherwise follow availableProcessors().
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=4
