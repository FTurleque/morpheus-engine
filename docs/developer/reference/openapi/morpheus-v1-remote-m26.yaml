    parameters:
      - $ref: '#/components/parameters/SavedViewId'
    post:
      summary: Remote overlay of saved view archival (morpheus-v1-query-m24.yaml).
      description: Requires WRITE. Relayed to the local API on the writes' deadline.
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
