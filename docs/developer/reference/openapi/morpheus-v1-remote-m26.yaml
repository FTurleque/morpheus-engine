openapi: 3.1.0
info:
  title: MORPHEUS Remote Server M26 Supplement
  version: 1.0.0-m26
  description: >-
    M26 opt-in HTTPS remote/team server additions and security overlays. Existing /api/v1 business routes remain the
    same semantic API but, in remote mode, are fronted by TLS, Bearer authentication and RBAC. Executable provider
    plugin probing is deliberately stricter in remote mode: POST + ADMIN + trusted SHA-256. Any relayed WRITE or ADMIN
    call can be answered 504 with an unknown outcome: UPSTREAM_WRITE_TIMEOUT when the local operation did not answer
    within the writes' deadline, RESPONSE_BUDGET_WRITE_TIMEOUT when it answered but no response slot freed up within
    that same deadline, counted from the moment the call was sent. The operation may have completed in both cases;
    read its state before retrying. Every operation that the facade relays on the writes' deadline declares that
    response below. A path below that another document of this directory also declares is a remote overlay of that
    operation: it lists the responses the facade adds, and its request and success response are those of the
    document that declares the operation.
servers:
  - url: https://127.0.0.1:8765/api/v1
security:
  - bearerAuth: []
paths:
  /server/status:
    get:
      operationId: getRemoteServerStatus
      summary: Read process-local remote server status
      responses:
        '200':
          description: Remote server status without credentials or business payloads
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerStatusEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /server/backups:
    post:
      operationId: createRemoteServerBackup
      summary: Create and verify a coherent SQLite backup
      description: Requires ADMIN. Restore is intentionally not exposed through HTTP.
      responses:
        '201':
          description: Backup created, integrity checked and schema checked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          description: >-
            BACKUP_TIMEOUT: the backup outlived the facade's deadline for a write or administration call. It may still
            complete; its outcome is unknown, not failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /provider-plugins/discover:
    get:
      operationId: discoverRemoteProviderPlugins
      summary: List provider-plugin metadata from the server-configured directory
      description: >-
        Remote overlay of the local provider-plugin discovery. Requires READ. Metadata only: no plugin is loaded and
        no plugin code runs. The plugin directory is configured by the server; a client that supplies `directory` is
        refused with SERVER_CONFIGURED_PLUGIN_DIRECTORY. The response is an allowlisted projection that names no
        server filesystem location.
      responses:
        '200':
          description: Provider-plugin discovery outcome from the existing v1 provider-plugin API
          content:
            application/json:
              schema:
                type: object
        '400':
          description: A client-supplied plugin directory, or an invalid provider-plugin request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /provider-plugins/probe:
    post:
      operationId: probeRemoteProviderPlugin
      summary: Probe one trusted provider plugin against an allowed workspace
      description: >-
        Remote security overlay for the local provider-plugin probe capability. Requires ADMIN. The plugin directory
        is server-configured and cannot be selected by the client. The workspace must belong to AllowedWorkspaceRoots.
        sha256 is mandatory and is verified on a private staging copy before any plugin classloading.
        The response is an allowlisted projection of the probe outcome: the plugin JAR is reported by name, and
        the probe result produced by third-party plugin code is projected field by field, so no server filesystem
        location reaches the caller through plugin-authored text, a diagnostic detail or a source locator.
      parameters:
        - name: pluginId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: workspace
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: sha256
          in: query
          required: true
          description: Trusted SHA-256 of the exact plugin JAR to execute.
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{64}$'
      responses:
        '200':
          description: Provider plugin probe outcome from the existing v1 provider-plugin API
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Missing/invalid SHA-256, disallowed workspace, or invalid provider-plugin request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          description: Remote provider-plugin probe requires POST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '504':
          $ref: '#/components/responses/RelayedWriteOutcomeUnknown'
  /metrics:
    get:
      summary: Remote overlay of the local metrics read (morpheus-v1.yaml).
      description: >-
        Requires ADMIN. Relayed to the local API on the writes' deadline: the deadline follows the role, so this
        GET has it too.
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '504':
          $ref: '#/components/responses/RelayedWriteOutcomeUnknown'
  /portfolios:
    post:
      summary: Remote overlay of portfolio creation (morpheus-v1-portfolio-m23.yaml).
      description: Requires WRITE. Relayed to the local API on the writes' deadline.
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '504':
          $ref: '#/components/responses/RelayedWriteOutcomeUnknown'
  /portfolios/{portfolioId}/projects:
    parameters:
      - $ref: '#/components/parameters/PortfolioId'
    post:
      summary: Remote overlay of adding a project to a portfolio (morpheus-v1-portfolio-m23.yaml).
      description: Requires WRITE. Relayed to the local API on the writes' deadline.
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '504':
          $ref: '#/components/responses/RelayedWriteOutcomeUnknown'
  /portfolios/{portfolioId}/projects/{projectId}/missing:
    parameters:
      - $ref: '#/components/parameters/PortfolioId'
      - $ref: '#/components/parameters/ProjectId'
    post:
      summary: Remote overlay of marking a portfolio member missing (morpheus-v1-portfolio-m23.yaml).
      description: Requires WRITE. Relayed to the local API on the writes' deadline.
      responses:
