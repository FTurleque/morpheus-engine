  /portfolios/{portfolioId}/projects/{projectId}/freshness:
    parameters:
      - $ref: '#/components/parameters/PortfolioId'
      - $ref: '#/components/parameters/ProjectId'
    post:
      summary: Remote overlay of recording the freshness of a portfolio member (morpheus-v1-portfolio-m23.yaml).
      description: Requires WRITE. Relayed to the local API on the writes' deadline.
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '504':
          $ref: '#/components/responses/RelayedWriteOutcomeUnknown'
  /portfolios/{portfolioId}/references:
    parameters:
      - $ref: '#/components/parameters/PortfolioId'
    post:
      summary: Remote overlay of declaring a portfolio reference (morpheus-v1-portfolio-m23.yaml).
      description: Requires WRITE. Relayed to the local API on the writes' deadline.
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '504':
          $ref: '#/components/responses/RelayedWriteOutcomeUnknown'
  /portfolios/{portfolioId}/traverse:
    parameters:
      - $ref: '#/components/parameters/PortfolioId'
    post:
      summary: Remote overlay of the portfolio traversal (morpheus-v1-portfolio-m23.yaml).
      description: Requires WRITE. Relayed to the local API on the writes' deadline.
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '504':
          $ref: '#/components/responses/RelayedWriteOutcomeUnknown'
  /projects:
    post:
      summary: Remote overlay of project registration (morpheus-v1.yaml).
      description: Requires WRITE. Relayed to the local API on the writes' deadline.
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '504':
          $ref: '#/components/responses/RelayedWriteOutcomeUnknown'
  /projects/{projectId}/sync:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      summary: Remote overlay of project synchronization (morpheus-v1.yaml).
      description: Requires WRITE. Relayed to the local API on the writes' deadline.
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '504':
          $ref: '#/components/responses/RelayedWriteOutcomeUnknown'
  /projects/{projectId}/changes/{changeId}/lifecycle-transitions:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ChangeId'
    post:
      summary: Remote overlay of a change lifecycle transition (morpheus-v1.yaml).
      description: Requires WRITE. Relayed to the local API on the writes' deadline.
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '504':
          $ref: '#/components/responses/RelayedWriteOutcomeUnknown'
  /saved-views:
    post:
      summary: Remote overlay of saved view creation (morpheus-v1-query-m24.yaml).
      description: Requires WRITE. Relayed to the local API on the writes' deadline.
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '504':
          $ref: '#/components/responses/RelayedWriteOutcomeUnknown'
  /saved-views/{savedViewId}:
    parameters:
      - $ref: '#/components/parameters/SavedViewId'
    put:
      summary: Remote overlay of saved view revision (morpheus-v1-query-m24.yaml).
      description: Requires WRITE. Relayed to the local API on the writes' deadline.
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
