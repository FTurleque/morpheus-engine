components:
  parameters:
    ChangeId:
      name: changeId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    PolicyPackId:
      name: policyPackId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    PortfolioId:
      name: portfolioId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    RuleId:
      name: ruleId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    SavedViewId:
      name: savedViewId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-256-bit-token
      description: >-
        Bearer token generated locally by the server identity lifecycle CLI. Only SHA-256(token) is persisted and the
        current identity file is reloaded for every remote authentication.
  responses:
    RelayedWriteOutcomeUnknown:
      description: >-
        UPSTREAM_WRITE_TIMEOUT: the local operation did not answer within the facade's deadline for a write or
        administration call. RESPONSE_BUDGET_WRITE_TIMEOUT: it answered, but no response slot freed up within that
        same deadline, counted from the moment the call was sent, and its response was not relayed. Either way the
        outcome is unknown, not failed: read the state before retrying.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthenticated:
      description: Missing, invalid, rotated or revoked Bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Authenticated principal lacks the required READ/WRITE/ADMIN role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooManyRequests:
      description: >-
        Explicit M26 concurrent request or aggregate proxy-response budget reached, or, for a backup,
        DATABASE_WORKERS_BUSY: every database worker of the facade stayed taken for the admission wait
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: >-
        INTERNAL_ERROR with a fixed message that names no server location. A backup request opens the database, and
        opening a database recorded at an older schema version first keeps a copy of it; when that copy cannot be
        written the store refuses to migrate (PRE_MIGRATION_BACKUP_FAILED, recorded in the server's operational trace) and the request ends
        here rather than on a migrated database without its copy.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ServerStatusEnvelope:
      type: object
      additionalProperties: false
      required: [apiVersion, data]
      properties:
        apiVersion:
          const: v1
        data:
          $ref: '#/components/schemas/ServerStatus'
    ServerStatus:
      type: object
      additionalProperties: false
      required:
        - mode
        - transport
        - host
        - port
        - startedAt
        - uptimeSeconds
        - activeRequests
        - maxConcurrentRequests
        - activePrivilegedRequests
        - maxConcurrentPrivilegedRequests
        - oldestActivePrivilegedRequestMillis
        - requestBodyReadTimeoutMillis
        - maxProxyResponseBytes
        - maxProxyInFlightBytes
        - maxConcurrentBufferedProxyResponses
        - totalRequests
        - totalPrivilegedRequests
        - authenticationFailures
        - authorizationFailures
        - throttledRequests
        - throttledPrivilegedRequests
        - requestTimeouts
        - responseWriteTimeouts
      properties:
        mode:
          const: REMOTE
        transport:
          const: HTTPS
        host:
          type: string
          minLength: 1
          maxLength: 255
        port:
          type: integer
          minimum: 1
          maximum: 65535
        startedAt:
          type: string
          format: date-time
        uptimeSeconds:
          type: integer
          minimum: 0
        activeRequests:
          type: integer
          minimum: 0
        maxConcurrentRequests:
          type: integer
          minimum: 1
          maximum: 512
        maxProxyResponseBytes:
          type: integer
          const: 16777216
        maxProxyInFlightBytes:
          type: integer
          const: 134217728
        maxConcurrentBufferedProxyResponses:
          type: integer
          const: 8
        totalRequests:
          type: integer
          minimum: 0
        authenticationFailures:
          type: integer
          minimum: 0
        authorizationFailures:
          type: integer
          minimum: 0
        throttledRequests:
          type: integer
          minimum: 0
        maxConcurrentPrivilegedRequests:
          type: integer
          minimum: 1
          maximum: 512
        activePrivilegedRequests:
          type: integer
          minimum: 0
        oldestActivePrivilegedRequestMillis:
          type: integer
          minimum: 0
          description: >-
            Age of the longest-running privileged operation, or 0 when none is running. A mutation carries no
            upstream deadline by design, so this is what separates a busy facade from a stuck one.
        requestBodyReadTimeoutMillis:
          type: integer
          minimum: 1
        totalPrivilegedRequests:
          type: integer
          minimum: 0
        throttledPrivilegedRequests:
          type: integer
          minimum: 0
        requestTimeouts:
          type: integer
          minimum: 0
          description: Requests whose body did not arrive within its read deadline.
        responseWriteTimeouts:
          type: integer
          minimum: 0
          description: >-
            Responses whose client stopped draining them and whose connection the facade reclaimed. Counted apart
            from requestTimeouts: one is a client that stopped sending, the other a client that stopped receiving,
            and only the second holds a request slot for as long as the client stays connected.
    BackupEnvelope:
      type: object
      additionalProperties: false
      required: [apiVersion, data]
      properties:
        apiVersion:
          const: v1
        data:
          $ref: '#/components/schemas/BackupVerification'
    BackupVerification:
      type: object
      additionalProperties: false
      required: [fileName, bytes, sha256, schemaVersion, integrityOk]
      properties:
        fileName:
          type: string
          minLength: 1
          maxLength: 255
          description: >-
            Backup file name within the server-configured backup directory. The absolute pathname is deliberately
            not exposed: the directory is not client-selectable and restore is offline-only, so the pathname would
            only describe the server's filesystem layout. The local CLI still reports it.
        bytes:
          type: integer
          minimum: 1
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        schemaVersion:
          type: integer
          minimum: 1
          maximum: 999
          description: >-
            Sanity ceiling, not a pin on the current schema. SqliteSchemaManager.SUPPORTED_SCHEMA_VERSION is
            normative; a ceiling equal to the current version silently rots into rejecting valid responses at the
            next migration.
        integrityOk:
          const: true
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [apiVersion, error]
      properties:
        apiVersion:
          const: v1
        error:
          type: object
          additionalProperties: false
          required: [code, message, details]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
