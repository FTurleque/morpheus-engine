# Per-module scale -- one coverage floor for each module of the population, read by CoverageQualityGateTest only.
# The population is derived from the root POM: every <module> that carries a class under src/main/java. Each module
# declares <artifactId>.lineCoverageMinimum and <artifactId>.branchCoverageMinimum, as ratios between 0 and 1; the
# gate refuses a module of the population without its two keys and a key that names no module of the population.
# The gate compares each module's own jacoco.xml to max(D2 floor, its floor), next to the total ratchet of
# config/m21-quality-ratchets.properties, which stays in force. A module under its floor is fixed by writing tests in
# that module, never by lowering its floor.
# A floor above the D2 floor (0.40 lines, 0.35 branches) needs kept evidence that carries the module's own counters,
# measured on Windows and Linux at one head (config/coverage-qualification/), and stays three times the module's
# spread under its lowest kept measurement: CoverageQualificationEvidenceTest refuses any other value (ADR-0163).
morpheus-domain.lineCoverageMinimum=0.40
morpheus-domain.branchCoverageMinimum=0.35
morpheus-application.lineCoverageMinimum=0.40
morpheus-application.branchCoverageMinimum=0.35
morpheus-provider-sdk.lineCoverageMinimum=0.40
morpheus-provider-sdk.branchCoverageMinimum=0.35
