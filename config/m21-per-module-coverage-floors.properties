morpheus-provider-testkit.branchCoverageMinimum=0.35
morpheus-provider-reference.lineCoverageMinimum=0.40
morpheus-provider-reference.branchCoverageMinimum=0.35
morpheus-provider-openspec.lineCoverageMinimum=0.40
morpheus-provider-openspec.branchCoverageMinimum=0.35
