morpheus-provider-markdown.branchCoverageMinimum=0.35
morpheus-provider-synthetic.lineCoverageMinimum=0.40
morpheus-provider-synthetic.branchCoverageMinimum=0.35
morpheus-store-memory.lineCoverageMinimum=0.40
morpheus-store-memory.branchCoverageMinimum=0.35
morpheus-store-sqlite.lineCoverageMinimum=0.40
morpheus-store-sqlite.branchCoverageMinimum=0.35
