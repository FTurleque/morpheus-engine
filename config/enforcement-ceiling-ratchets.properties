# Ceilings of the populations of textual bans that the architecture suite measures: one key per ceiling, keyed by
# TestClass.FIELD, valued by the ceiling the test declares. EnforcementMechanismAccountingTest and
# TypeBansAwaitingABytecodeRuleTest refuse a ceiling that differs from its key, a missing key and a key no ceiling reads.
# These keys are only ever lowered: a member removed lowers the ceiling and its key in the same change. Raising a key
# touches this governance file, and the pull request says why no rule on the bytecode or no message could hold the ban.
EnforcementMechanismAccountingTest.UNEXPLAINED_TYPE_BAN_CEILING=0
TypeBansAwaitingABytecodeRuleTest.AWAITING_A_RULE_CEILING=0
