# Debt counters of the architecture tests: one key per list that ProductionClassListsArchitectureTest declares a debt
# counter, keyed by TestClass.FIELD, valued by the size of the list. A set or a list counts its elements, a map its
# entries, or the elements of its values when they are all collections.
# These keys are only ever lowered. ProductionClassListsArchitectureTest refuses a list larger than its key -- the
# counter grew -- and one smaller -- the key must follow the list down in the same change, or the list could grow back
# to it. Raising a key needs the consolidated decision record that names the new entry, and the pull request says so.
AdapterCompositionRootArchitectureTest.COMPOSITION_ROOTS=5
ApplicationTechnologyBoundaryArchitectureTest.CONFINED_FAMILIES=26
ApplicationTechnologyBoundaryArchitectureTest.REFLECTION_AND_LOADING=2
SqliteStorePackagesArchitectureTest.RUNTIME_ENTRY_POINTS=2
SqliteStorePackagesArchitectureTest.RUNTIME_PUBLIC_TYPES=13
