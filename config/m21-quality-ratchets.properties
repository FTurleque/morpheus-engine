# Durable M21 quality ratchets. Raise only after reproducible exact-head Windows + Linux evidence.
# Presence -- two measures, because one count cannot answer both "were tests removed" and "did an option matrix change".
# Surefire names each invocation of a test factory, of a parameterised or of a repeated test `method()[N]`; a declared
# test method keeps its bare name. testsMinimum bounds the declared ones, so it is smaller than the Surefire total.
# generatedTestsMinimum bounds the others and follows the option matrix of the CLI: the change that removes an option
# or a command lowers it and says so; testsMinimum only rises (ADR-0089).
# Both keys sit ten under the measurement: 2830 declared and 1826 generated executions on 28/10/2026 at eb5c7db7,
# identical on Linux and Windows. Both counts are deterministic, so the ten absorb no run-to-run variation: they are
# the executions that may disappear before the validators refuse the build, the margin of architectureTestsMinimum.
testsMinimum=2820
generatedTestsMinimum=1816
# architectureTestsMinimum bounds the declared executions of morpheus-architecture-tests alone and sits ten under the
# measurement. The count is deterministic -- 823 on 28/10/2026 at 61198c68, identical on Linux and Windows across
# two CI runs each -- so the ten absorb no run-to-run variation: they are the architecture executions that may
# disappear, merged or split by intent, before the validators refuse the build. A larger gap is a forgotten floor.
architectureTestsMinimum=813

# Per-module scale -- the sum of every */target/site/jacoco/jacoco.xml except the architecture-test module's.
# It measures what each module covers without help from the others, so a service exercised only through a
# sibling module's tests reads as uncovered here. Consumed by CoverageQualityGateTest only.
perModuleLineCoverageMinimum=0.712
perModuleBranchCoverageMinimum=0.625

# Aggregate scale -- morpheus-coverage-report/target/site/jacoco-aggregate/jacoco.xml, the canonical
# measurement, which also merges the cross-module execution of the architecture tests. Its population is the
# per-module scale's -- every reactor module with main classes, verification tooling included -- and
# AggregateCoverageGateTest refuses a report that measured another one.
# Consumed by AggregateCoverageGateTest and by both validate-m21 scripts.
aggregateLineCoverageMinimum=0.912
aggregateBranchCoverageMinimum=0.773
