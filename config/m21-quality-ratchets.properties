# Durable M21 quality ratchets. Raise only after reproducible exact-head Windows + Linux evidence.
testsMinimum=1550
architectureTestsMinimum=385

# Per-module scale -- the sum of every */target/site/jacoco/jacoco.xml except the architecture-test module's.
# It measures what each module covers without help from the others, so a service exercised only through a
# sibling module's tests reads as uncovered here. Consumed by CoverageQualityGateTest only.
perModuleLineCoverageMinimum=0.620
perModuleBranchCoverageMinimum=0.535

# Aggregate scale -- morpheus-coverage-report/target/site/jacoco-aggregate/jacoco.xml, the canonical
# measurement, which also merges the cross-module execution of the architecture tests.
# Consumed by AggregateCoverageGateTest and by both validate-m21 scripts.
aggregateLineCoverageMinimum=0.850
aggregateBranchCoverageMinimum=0.680
