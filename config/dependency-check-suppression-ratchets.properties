# Extent of config/dependency-check-suppressions.xml: the number of detections the file switches off, equal to the
# size of DependencyCheckSuppressionContractTest.SUPPRESSED_DETECTIONS, the exact table of their targets.
# This key is only ever lowered. A rule added to the suppression file raises it in the same change, and the pull
# request says why the detection is a false positive or does not apply; a rule removed lowers it in the same change.
suppressedDetections=3
