# JUnit runs the tests of this module in parallel, classes and methods alike (ADR-0115).
# Possible since the connection scope counts on the recorder its opener names: no test of this module reads a counter
# shared by the JVM any more. SqliteDatabaseLeaseTest counts the descriptors of the whole JVM on Linux and macOS, so it
# is @Isolated. Measured clean four times out of four (209 executions each, on Windows) before being switched on.
# A test added here that reads a static of the process, sets a system property or the default locale breaks it.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.mode.classes.default=concurrent
# A fixed pool, so that a race a laptop with two cores hides is not left to a runner with sixteen to find: the
# parallelism would otherwise follow availableProcessors().
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=4
# NoSqliteScopeLeftBehindExtension names the test that leaves a connection scope on its thread (AUD-QUA-18).
junit.jupiter.extensions.autodetection.enabled=true
