# JUnit runs the tests of this module in parallel, classes and methods alike (ADR-0115, amendment of 15/10/2026).
# Possible since the connection scope counts on the recorder its opener names: no test of this module reads state
# shared by the JVM any more. Measured clean four times out of four (209 executions each) before being switched on.
# A test added here that reads a static of the process, sets a system property or the default locale breaks it.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.mode.classes.default=concurrent
