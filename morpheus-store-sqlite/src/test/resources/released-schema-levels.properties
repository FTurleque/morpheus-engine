# The schema level each published version shipped: the number of its last migration, read from the tag
# (git ls-tree --name-only <tag> morpheus-store-sqlite/src/main/resources/db/migration/).
# ReleasedSchemaUpgradeTest upgrades one database per distinct level here, and
# ReleasedSchemaLevelsDeclarationTest fails the build when a version with release notes below the product version
# has no line. The version after a release adds the line for the release just shipped.
1.0.0=12
1.1.0=15
1.2.0=15
1.2.1=20
