# Authenticode signing declaration of the MORPHEUS Windows distribution.
#
# The single source of the expected publisher and of the first signed version. The release qualification
# (scripts/verify-release-provenance.ps1 and .sh), the release rehearsal (scripts/validate-m20.ps1), the release build
# (distribution/build-release.ps1) and the signing entry point (distribution/windows/sign-windows-binary.ps1) read it;
# none of them holds a publisher name of its own, and none falls back to "any signer" when a field is empty.
# Moving a field is reviewed like a ratchet: the change that fills them is the cutover that wires the release signing
# identity into release.yml, and it fills all three together.

# The certificate subject of the release signing identity, exactly as Get-AuthenticodeSignature reports it in
# SignerCertificate.Subject. Empty until the certificate exists; the maintainer fills it from a dry signature.
publisherSubject=

# The first product version whose Windows release is signed. Empty until the first signed release is cut. A release at
# or above it must be signed; a release below it is reported "unsigned by declared baseline". It is never greater than
# the version the root POM declares.
signingBaseline=

# The RFC 3161 timestamp authority every release signature is countersigned by. Empty until the provider is chosen; no
# fallback authority is chosen at run time.
timestampAuthority=
