name: M12 preflight (historical manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Maven gate
        shell: pwsh
        run: .\mvnw.cmd clean test
      - name: Portable packaging
        shell: pwsh
        run: .\distribution\build-portable.ps1
