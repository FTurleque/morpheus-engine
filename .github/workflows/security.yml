name: MORPHEUS Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Trusted refresh must run more frequently than DEPENDENCY_CHECK_MAX_CACHE_AGE_HOURS.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  DEPENDENCY_CHECK_MAX_CACHE_AGE_HOURS: '72'

concurrency:
  group: morpheus-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-check:
    name: dependency-check (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          check-latest: false

      - name: Restore Dependency-Check database
        id: dependency-check-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/dependency-check-data
          key: dependency-check-v13-trusted-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            dependency-check-v13-trusted-${{ runner.os }}-
            dependency-check-v12-trusted-${{ runner.os }}-

      - name: Verify restored Dependency-Check database freshness
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          data_dir="${GITHUB_WORKSPACE}/target/dependency-check-data"
          db_file="$(find "${data_dir}" -type f \( -name 'odc*.mv.db' -o -name 'odc*.db' \) -print -quit 2>/dev/null || true)"
          if [[ -z "${db_file}" ]]; then
            echo "::error::No trusted Dependency-Check database was restored for this pull request."
            exit 1
          fi
          now_epoch="$(date +%s)"
          modified_epoch="$(stat -c %Y "${db_file}")"
          age_seconds="$((now_epoch - modified_epoch))"
          max_age_seconds="$((DEPENDENCY_CHECK_MAX_CACHE_AGE_HOURS * 60 * 60))"
          if (( age_seconds < 0 || age_seconds > max_age_seconds )); then
            echo "::error::Restored Dependency-Check database is stale (${age_seconds}s old; maximum ${max_age_seconds}s)."
            exit 1
          fi
          echo "Dependency-Check database freshness PASS (${age_seconds}s old; maximum ${max_age_seconds}s)."

      - name: Remove stale Dependency-Check update lock
        shell: bash
        run: |
          lock_file="${GITHUB_WORKSPACE}/target/dependency-check-data/odc.update.lock"
          if [[ -e "${lock_file}" ]]; then
            echo "::warning::Removing stale Dependency-Check update lock restored from cache."
            rm -f -- "${lock_file}"
          fi

      - name: Update Dependency-Check vulnerability database (trusted events)
        id: dependency-check-update
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          echo "updated=false" >> "${GITHUB_OUTPUT}"
          data_dir="${GITHUB_WORKSPACE}/target/dependency-check-data"
          if [[ -n "${NVD_API_KEY:-}" ]]; then
            ./mvnw \
              -Pd2-security \
              "-DdataDirectory=${data_dir}" \
              -DnvdApiKeyEnvironmentVariable=NVD_API_KEY \
              org.owasp:dependency-check-maven:13.0.0:update-only
            echo "updated=true" >> "${GITHUB_OUTPUT}"
          else
            # Dependency-Check 13.0.0 upstream bug #8715 treats its built-in blank nvd.api.key as a real key.
            # Until a release containing upstream fix #8716 exists, never attempt the broken anonymous update.
            echo "::warning::NVD_API_KEY is not configured; Dependency-Check 13.0.0 anonymous update is broken upstream. Reusing a fresh trusted cache."
            db_file="$(find "${data_dir}" -type f \( -name 'odc*.mv.db' -o -name 'odc*.db' \) -print -quit 2>/dev/null || true)"
            if [[ -z "${db_file}" ]]; then
              echo "::error::No trusted Dependency-Check database is available. Configure NVD_API_KEY or upgrade Dependency-Check once upstream fix #8716 is released."
              exit 1
            fi
            now_epoch="$(date +%s)"
            modified_epoch="$(stat -c %Y "${db_file}")"
            age_seconds="$((now_epoch - modified_epoch))"
            max_age_seconds="$((DEPENDENCY_CHECK_MAX_CACHE_AGE_HOURS * 60 * 60))"
            if (( age_seconds < 0 || age_seconds > max_age_seconds )); then
              echo "::error::Trusted Dependency-Check database is stale (${age_seconds}s old; maximum ${max_age_seconds}s). Configure NVD_API_KEY or upgrade Dependency-Check once upstream fix #8716 is released."
              exit 1
            fi
            echo "Dependency-Check trusted cache fallback PASS (${age_seconds}s old; maximum ${max_age_seconds}s)."
          fi

      - name: Save trusted Dependency-Check database
        if: github.event_name != 'pull_request' && steps.dependency-check-update.outputs.updated == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/dependency-check-data
          key: dependency-check-v13-trusted-${{ runner.os }}-${{ github.run_id }}

      - name: Run OWASP Dependency-Check scan
        shell: bash
        run: |
          ./mvnw \
            -Pd2-security \
            "-DdataDirectory=${GITHUB_WORKSPACE}/target/dependency-check-data" \
            -DautoUpdate=false \
            org.owasp:dependency-check-maven:13.0.0:aggregate

      - name: Upload dependency-check evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-check
          if-no-files-found: warn
          retention-days: 14
          path: target/d2-security/**
