name: MORPHEUS Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morpheus-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-check:
    name: dependency-check (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          check-latest: false

      - name: Run OWASP Dependency-Check
        shell: bash
        run: ./mvnw -Pd2-security org.owasp:dependency-check-maven:12.2.2:aggregate

      - name: Upload dependency-check evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-check
          if-no-files-found: warn
          retention-days: 14
          path: target/d2-security/**
