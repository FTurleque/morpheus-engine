name: MORPHEUS Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Trusted refresh must run more frequently than DEPENDENCY_CHECK_MAX_CACHE_AGE_HOURS.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  DEPENDENCY_CHECK_MAX_CACHE_AGE_HOURS: '72'
  # The H2 schema Dependency-Check expects (`data.version` in dependency-check-core), pinned in the root POM
  # as <dependency-check.data.version> and kept in step with it by DependencyCheckWorkflowContractTest.
  DEPENDENCY_CHECK_SCHEMA_VERSION: '5.6'
  DEPENDENCY_CHECK_PLUGIN_VERSION: '13.0.0'

concurrency:
  group: morpheus-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-check:
    name: dependency-check (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          check-latest: false

      - name: Restore Dependency-Check database
        id: dependency-check-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/dependency-check-data
          # Keyed on the H2 schema version, not on the plugin version.
          #
          # What a cache key must answer is whether the running analyzer can read this database, and that is
          # decided by the schema alone. Dependency-Check 12.2.2 and 13.0.0 both declare data.version 5.6 and
          # ship byte-identical data/initialize.sql and data/dbStatements.properties; upstream changed the
          # schema at 12.2.2, not at 13.0.0. A plugin-versioned key therefore answered a question nobody
          # asked, and answered it wrongly in both directions: it orphaned a perfectly readable database on a
          # routine bump, and the v12 restore-key added to paper over that orphaning would equally have
          # matched a genuinely incompatible database had the schema really moved.
          #
          # Keyed on the schema there is nothing left to fall back to. A schema change produces a different
          # key, no match, and an honest cold start -- which is the correct outcome, because the alternative
          # is a database the analyzer will refuse anyway: every scan below runs -DautoUpdate=false, under
          # which Dependency-Check throws rather than migrating a mismatched schema.
          key: dependency-check-schema${{ env.DEPENDENCY_CHECK_SCHEMA_VERSION }}-trusted-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            dependency-check-schema${{ env.DEPENDENCY_CHECK_SCHEMA_VERSION }}-trusted-${{ runner.os }}-

      # Freshness is read from the sentinel a real refresh wrote, never from a file mtime. An mtime says when
      # Dependency-Check last rewrote some file, survives actions/cache restore untouched because tar
      # preserves it, and an incremental update-only that rewrites nothing leaves it stale behind a current
      # database. The sentinel is a fact the refresh produces; the mtime was a side effect of the filesystem.
      - name: Verify restored Dependency-Check database freshness
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          data_dir="${GITHUB_WORKSPACE}/target/dependency-check-data"
          facts="$(bash ./scripts/read-dependency-check-sentinel.sh "${data_dir}" "${DEPENDENCY_CHECK_SCHEMA_VERSION}")"
          status="$(sed -n 's/^status=//p' <<< "${facts}" | head -n 1)"

          if [[ "${status}" != 'OK' ]]; then
            echo "::error::MORPHEUS_DEPENDENCY_CHECK_FAILURE=STALE_DATABASE. No trusted Dependency-Check refresh could be established for this pull request (${status}). A cache restored without a trusted-refresh sentinel has an unknown age, and an unknown age is not a fresh one. This is an infrastructure failure, not a vulnerability finding. Expected right after the cache namespace or the sentinel format changes: no entry exists under the new key yet. It clears when a trusted event writes the first sentinel, and on this branch exactly one thing can do that: NVD_API_KEY being configured. Waiting for a schedule will NOT clear it -- the only writer is the API-key path, because Dependency-Check 13.0.0 cannot refresh anonymously (upstream #8715, fixed in the unreleased 13.0.1). Backporting this sentinel writer to a branch still pinned to 12.2.2, whose anonymous refresh works and which writes the same H2 schema, would also bootstrap it. See RT-13 in docs/architecture/risks/register.md. Do not widen DEPENDENCY_CHECK_MAX_CACHE_AGE_HOURS and do not add a fallback that accepts an undated database: either would discard the measurement this refusal exists to make."
            exit 1
          fi

          age_seconds="$(sed -n 's/^ageSeconds=//p' <<< "${facts}" | head -n 1)"
          max_age_seconds="$((DEPENDENCY_CHECK_MAX_CACHE_AGE_HOURS * 60 * 60))"
          bash ./scripts/report-dependency-check-cache.sh "${age_seconds}" "trusted cache restored for this pull request"
          if (( age_seconds < 0 || age_seconds > max_age_seconds )); then
            echo "::error::MORPHEUS_DEPENDENCY_CHECK_FAILURE=STALE_DATABASE. Restored Dependency-Check database is stale (${age_seconds}s since its last trusted refresh; maximum ${max_age_seconds}s). This is an infrastructure failure, not a vulnerability finding: no dependency crossed the CVSS threshold, the vulnerability feed is simply too old to scan against."
            exit 1
          fi
          echo "Dependency-Check database freshness PASS (${age_seconds}s since its last trusted refresh; maximum ${max_age_seconds}s)."

      - name: Remove stale Dependency-Check update lock
        shell: bash
        run: |
          lock_file="${GITHUB_WORKSPACE}/target/dependency-check-data/odc.update.lock"
          if [[ -e "${lock_file}" ]]; then
            echo "::warning::Removing stale Dependency-Check update lock restored from cache."
            rm -f -- "${lock_file}"
          fi

      - name: Update Dependency-Check vulnerability database (trusted events)
        id: dependency-check-update
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          echo "updated=false" >> "${GITHUB_OUTPUT}"
          data_dir="${GITHUB_WORKSPACE}/target/dependency-check-data"
          max_age_seconds="$((DEPENDENCY_CHECK_MAX_CACHE_AGE_HOURS * 60 * 60))"
          if [[ -n "${NVD_API_KEY:-}" ]]; then
            ./mvnw \
              -Pd2-security \
              "-DdataDirectory=${data_dir}" \
              -DnvdApiKeyEnvironmentVariable=NVD_API_KEY \
              org.owasp:dependency-check-maven:13.0.0:update-only
            # The sentinel is written here and only here on this path: after the refresh succeeded, so its
            # presence is evidence the feed was actually renewed rather than that a file happens to exist.
            bash ./scripts/write-dependency-check-sentinel.sh \
              "${data_dir}" "${DEPENDENCY_CHECK_PLUGIN_VERSION}" "${DEPENDENCY_CHECK_SCHEMA_VERSION}" "NVD API key refresh"
            echo "updated=true" >> "${GITHUB_OUTPUT}"
            bash ./scripts/report-dependency-check-cache.sh 0 "NVD API key refresh"
          else
            # Dependency-Check 13.0.0 upstream bug #8715 treats its built-in blank nvd.api.key as a real key.
            # Until a release containing upstream fix #8716 exists, never attempt the broken anonymous update.
            echo "::warning::NVD_API_KEY is not configured; Dependency-Check 13.0.0 anonymous update is broken upstream. Reusing a fresh trusted cache."
            facts="$(bash ./scripts/read-dependency-check-sentinel.sh "${data_dir}" "${DEPENDENCY_CHECK_SCHEMA_VERSION}")"
            status="$(sed -n 's/^status=//p' <<< "${facts}" | head -n 1)"
            if [[ "${status}" != 'OK' ]]; then
              echo "::error::MORPHEUS_DEPENDENCY_CHECK_FAILURE=STALE_DATABASE. No trusted Dependency-Check database is available (${status}): nothing here refreshed the feed, and the restored cache carries no trusted-refresh sentinel to date. Configure NVD_API_KEY or upgrade Dependency-Check once upstream fix #8716 is released."
              exit 1
            fi
            age_seconds="$(sed -n 's/^ageSeconds=//p' <<< "${facts}" | head -n 1)"
            bash ./scripts/report-dependency-check-cache.sh "${age_seconds}" "trusted cache fallback (NVD_API_KEY absent, no refresh performed)"
            if (( age_seconds < 0 || age_seconds > max_age_seconds )); then
              echo "::error::MORPHEUS_DEPENDENCY_CHECK_FAILURE=STALE_DATABASE. Trusted Dependency-Check database is stale (${age_seconds}s since its last trusted refresh; maximum ${max_age_seconds}s). Configure NVD_API_KEY or upgrade Dependency-Check once upstream fix #8716 is released. This is an infrastructure failure, not a vulnerability finding."
              exit 1
            fi
            echo "Dependency-Check trusted cache fallback PASS (${age_seconds}s since its last trusted refresh; maximum ${max_age_seconds}s)."
          fi

      - name: Save trusted Dependency-Check database
        if: github.event_name != 'pull_request' && steps.dependency-check-update.outputs.updated == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/dependency-check-data
          key: dependency-check-schema${{ env.DEPENDENCY_CHECK_SCHEMA_VERSION }}-trusted-${{ runner.os }}-${{ github.run_id }}

      - name: Run OWASP Dependency-Check scan
        shell: bash
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP}/dependency-check-product.log"
          if ./mvnw \
            -Pd2-security \
            "-DdataDirectory=${GITHUB_WORKSPACE}/target/dependency-check-data" \
            -DautoUpdate=false \
            org.owasp:dependency-check-maven:13.0.0:aggregate 2>&1 | tee "${log}"; then
            exit 0
          fi
          bash ./scripts/classify-dependency-check-failure.sh "${log}" "product runtime dependencies"

      # The product SBOM and the scan above exclude test scope on purpose: those artifacts are never shipped.
      # They are executed on every machine that builds MORPHEUS, so they get their own fail-closed scan rather
      # than no scan at all. It reuses the trusted database the steps above already prepared, so this second
      # look costs no additional NVD traffic.
      - name: Run OWASP Dependency-Check scan over build and test dependencies
        shell: bash
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP}/dependency-check-build-and-test.log"
          if ./mvnw \
            -Pd2-security-tests \
            "-DdataDirectory=${GITHUB_WORKSPACE}/target/dependency-check-data" \
            -DautoUpdate=false \
            org.owasp:dependency-check-maven:13.0.0:aggregate 2>&1 | tee "${log}"; then
            exit 0
          fi
          bash ./scripts/classify-dependency-check-failure.sh "${log}" "build and test dependencies"

      - name: Upload dependency-check evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-check
          if-no-files-found: warn
          retention-days: 14
          path: |
            target/d2-security/**
            target/d2-security-tests/**
