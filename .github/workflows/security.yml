name: MORPHEUS Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Trusted refresh must run more frequently than DEPENDENCY_CHECK_MAX_CACHE_AGE_HOURS.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  DEPENDENCY_CHECK_MAX_CACHE_AGE_HOURS: '72'
  # The H2 schema Dependency-Check expects (`data.version` in dependency-check-core), pinned in the root POM
  # as <dependency-check.data.version> and kept in step with it by DependencyCheckWorkflowContractTest.
  DEPENDENCY_CHECK_SCHEMA_VERSION: '5.6'
  DEPENDENCY_CHECK_PLUGIN_VERSION: '13.0.0'
  # The second refresh source: the CVE JSON 2.0 feeds the NVD publishes, read by Dependency-Check's data-feed path.
  # That path needs no key and never reaches the API client that upstream #8715 breaks, so the gate keeps a source
  # when NVD_API_KEY is absent, refused or failing. Dependency-Check builds the feed index from the `.meta` files
  # published next to each `.json.gz`.
  NVD_DATAFEED_URL: 'https://nvd.nist.gov/feeds/json/cve/2.0/nvdcve-2.0-{0}.json.gz'

concurrency:
  group: morpheus-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-check:
    name: dependency-check (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Facts the refresh-alert job below needs, published by the update step and nothing else: whether this run renewed
    # the feed, how old the database it scanned is, and why it did not renew it. They are empty when the update step
    # did not get that far (a pull request, a failure, a cancellation), and the alert job reads empty as "unknown".
    outputs:
      refreshed: ${{ steps.dependency-check-update.outputs.updated }}
      refresh_age_seconds: ${{ steps.dependency-check-update.outputs.refresh_age_seconds }}
      refresh_cause: ${{ steps.dependency-check-update.outputs.refresh_cause }}

    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          check-latest: false

      - name: Restore Dependency-Check database
        id: dependency-check-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/dependency-check-data
          # Keyed on the H2 schema version, not on the plugin version.
          #
          # What a cache key must answer is whether the running analyzer can read this database, and that is
          # decided by the schema alone. Dependency-Check 12.2.2 and 13.0.0 both declare data.version 5.6 and
          # ship byte-identical data/initialize.sql and data/dbStatements.properties; upstream changed the
          # schema at 12.2.2, not at 13.0.0. A plugin-versioned key therefore answered a question nobody
          # asked, and answered it wrongly in both directions: it orphaned a perfectly readable database on a
          # routine bump, and the v12 restore-key added to paper over that orphaning would equally have
          # matched a genuinely incompatible database had the schema really moved.
          #
          # Keyed on the schema there is nothing left to fall back to. A schema change produces a different
          # key, no match, and an honest cold start -- which is the correct outcome, because the alternative
          # is a database the analyzer will refuse anyway: every scan below runs -DautoUpdate=false, under
          # which Dependency-Check throws rather than migrating a mismatched schema.
          key: dependency-check-schema${{ env.DEPENDENCY_CHECK_SCHEMA_VERSION }}-trusted-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            dependency-check-schema${{ env.DEPENDENCY_CHECK_SCHEMA_VERSION }}-trusted-${{ runner.os }}-

      # Freshness is read from the sentinel a real refresh wrote, never from a file mtime. An mtime says when
      # Dependency-Check last rewrote some file, survives actions/cache restore untouched because tar
      # preserves it, and an incremental update-only that rewrites nothing leaves it stale behind a current
      # database. The sentinel is a fact the refresh produces; the mtime was a side effect of the filesystem.
      - name: Verify restored Dependency-Check database freshness
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          data_dir="${GITHUB_WORKSPACE}/target/dependency-check-data"
          facts="$(bash ./scripts/read-dependency-check-sentinel.sh "${data_dir}" "${DEPENDENCY_CHECK_SCHEMA_VERSION}")"
          status="$(sed -n 's/^status=//p' <<< "${facts}" | head -n 1)"

          if [[ "${status}" != 'OK' ]]; then
            echo "::error::MORPHEUS_DEPENDENCY_CHECK_FAILURE=STALE_DATABASE. No trusted Dependency-Check refresh could be established for this pull request (${status}). A cache restored without a trusted-refresh sentinel has an unknown age, and an unknown age is not a fresh one. This is an infrastructure failure, not a vulnerability finding. Expected right after the cache namespace or the sentinel format changes: no entry exists under the new key yet. It clears when a trusted event (push, schedule or workflow_dispatch) writes the first sentinel: the refresh with NVD_API_KEY or, without a working key, the refresh from the NVD data feeds. If it persists after such a run, read the update step of that run. See RT-13 in docs/architecture/risks/register.md. Do not widen DEPENDENCY_CHECK_MAX_CACHE_AGE_HOURS and do not add a fallback that accepts an undated database: either would discard the measurement this refusal exists to make."
            exit 1
          fi

          age_seconds="$(sed -n 's/^ageSeconds=//p' <<< "${facts}" | head -n 1)"
          max_age_seconds="$((DEPENDENCY_CHECK_MAX_CACHE_AGE_HOURS * 60 * 60))"
          # The summary names the provenance the sentinel recorded, never a literal describing this run. A
          # literal here can only say how the database reached this run -- always "restored from cache" on a
          # pull request -- and it keeps saying exactly that after the refresh that produced the database
          # stops using NVD_API_KEY. The sentinel already carries how the feed was obtained; re-deriving that
          # from a constant is what would leave a lost key invisible until the freshness budget expired three
          # days later, under a reason indistinguishable from a legitimately old cache.
          #
          # The role of this run stays implicit in the age already published: 0 is a refresh performed here,
          # anything else is a restore. A field of its own would be a field a caller could fill falsely.
          refreshed_by="$(sed -n 's/^refreshedBy=//p' <<< "${facts}" | head -n 1)"
          bash ./scripts/report-dependency-check-cache.sh "${age_seconds}" "${refreshed_by:-unknown}"

          # A database this branch produced carries one of two labels: the API-key refresh or the data-feed
          # refresh. Any other provenance was written elsewhere -- most plausibly the branch still pinned to
          # 12.2.2, whose anonymous refresh works and whose database uses the same H2 schema. That case is
          # legitimate, so this warns and never refuses: the freshness budget bounds the deviation regardless.
          # What it must not do is stay quiet, because a sentinel writer that stopped running on this branch
          # reads exactly the same way and nothing else would say so before the budget expired three days later.
          if [[ "${refreshed_by:-unknown}" != 'NVD API key refresh' && "${refreshed_by:-unknown}" != 'NVD data feed refresh' ]]; then
            plugin_version="$(sed -n 's/^pluginVersion=//p' <<< "${facts}" | head -n 1)"
            refreshed_on_ref="$(sed -n 's/^refreshedOnRef=//p' <<< "${facts}" | head -n 1)"
            echo "::warning::Dependency-Check database was obtained via ${refreshed_by:-unknown}, neither of the two refresh sources of a branch pinned to Dependency-Check ${DEPENDENCY_CHECK_PLUGIN_VERSION} (NVD API key refresh, NVD data feed refresh). The sentinel was written by Dependency-Check ${plugin_version:-unknown} on ${refreshed_on_ref:-unknown}. Expected while bootstrapping from the branch pinned to 12.2.2; otherwise the sentinel writer of this branch has stopped running. See RT-13 in docs/architecture/risks/register.md."
          fi

          if (( age_seconds < 0 || age_seconds > max_age_seconds )); then
            echo "::error::MORPHEUS_DEPENDENCY_CHECK_FAILURE=STALE_DATABASE. Restored Dependency-Check database is stale (${age_seconds}s since its last trusted refresh; maximum ${max_age_seconds}s). This is an infrastructure failure, not a vulnerability finding: no dependency crossed the CVSS threshold, the vulnerability feed is simply too old to scan against."
            exit 1
          fi
          echo "Dependency-Check database freshness PASS (${age_seconds}s since its last trusted refresh; maximum ${max_age_seconds}s)."

      - name: Remove stale Dependency-Check update lock
        shell: bash
        run: |
          lock_file="${GITHUB_WORKSPACE}/target/dependency-check-data/odc.update.lock"
          if [[ -e "${lock_file}" ]]; then
            echo "::warning::Removing stale Dependency-Check update lock restored from cache."
            rm -f -- "${lock_file}"
          fi

      - name: Update Dependency-Check vulnerability database (trusted events)
        id: dependency-check-update
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          echo "updated=false" >> "${GITHUB_OUTPUT}"
          data_dir="${GITHUB_WORKSPACE}/target/dependency-check-data"
          max_age_seconds="$((DEPENDENCY_CHECK_MAX_CACHE_AGE_HOURS * 60 * 60))"

          # A refresh that did not happen must never be reported as one -- and it is also not, by itself, a
          # reason to refuse a database that is still inside its freshness budget. The budget is the refusal,
          # and it already exists below. The no-key branch has always worked that way; the key branch did not,
          # so a key the NVD refuses killed the step outright while a fresh trusted cache sat right there.
          # An invalid or unactivated key is epistemically identical to an absent one: nothing here refreshed
          # the feed. Every way of not refreshing converges on the same handling, and `refresh_skipped_because`
          # carries which one it was into every message, so they are never told apart by reading the workflow.
          #
          # What does not converge: a failed refresh writes no sentinel and leaves `updated=false`, so no cache
          # is published and nothing later can mistake this run for a refresh. Every way the key path does not
          # refresh then goes to the data-feed refresh, the second source, before the cache fallback.
          #
          # The cause is read from the log, never assumed from the exit status: an NVD outage, a quota, a network
          # cut or an unreachable Maven repository fail the same command as a refused key, and naming the key for
          # all of them sent operators to replace a key that worked. Only the marker the NVD actually printed for
          # a refused key (run 35269719882, 2026-09-17) names the key. Under pipefail the status is still Maven's.
          set -o pipefail
          refresh_skipped_because=''
          if [[ -n "${NVD_API_KEY:-}" ]]; then
            update_log="${RUNNER_TEMP}/dependency-check-update.log"
            if ./mvnw \
              -Pd2-security \
              "-DdataDirectory=${data_dir}" \
              -DnvdApiKeyEnvironmentVariable=NVD_API_KEY \
              org.owasp:dependency-check-maven:13.0.0:update-only 2>&1 | tee "${update_log}"; then
              # The sentinel is written here and only here on this path: after the refresh succeeded, so its
              # presence is evidence the feed was actually renewed rather than that a file happens to exist.
              bash ./scripts/write-dependency-check-sentinel.sh \
                "${data_dir}" "${DEPENDENCY_CHECK_PLUGIN_VERSION}" "${DEPENDENCY_CHECK_SCHEMA_VERSION}" "NVD API key refresh"
              echo "updated=true" >> "${GITHUB_OUTPUT}"
              echo "refresh_age_seconds=0" >> "${GITHUB_OUTPUT}"
              bash ./scripts/report-dependency-check-cache.sh 0 "NVD API key refresh"
            elif grep -qF 'Invalid API Key' "${update_log}"; then
              refresh_skipped_because='NVD_API_KEY was refused by the NVD'
              echo "::warning::MORPHEUS_DEPENDENCY_CHECK_REFRESH=REFRESH_FAILED. The NVD refused NVD_API_KEY (the refresh log reports Invalid API Key); the NVD refuses an invalid or unactivated key exactly as it refuses a wrong one. The NVD API path refreshed nothing; the NVD data feed refresh is tried next. Replace NVD_API_KEY: until then the gate has one refresh source instead of two. See RT-13 in docs/architecture/risks/register.md."
            else
              refresh_skipped_because='the NVD refresh failed with NVD_API_KEY configured'
              echo "::warning::MORPHEUS_DEPENDENCY_CHECK_REFRESH=REFRESH_FAILED. The trusted Dependency-Check refresh did not complete, and its log does not report a refused key: the cause is in the log of this step (NVD outage, quota, network, Maven repository). Do not rotate the key on this evidence alone. The NVD API path refreshed nothing; the NVD data feed refresh is tried next. See docs/developer/COLD_START_RECOVERY.md."
            fi
          else
            # Dependency-Check 13.0.0 upstream bug #8715 treats its built-in blank nvd.api.key as a real key.
            # Until a release containing upstream fix #8716 exists, never attempt the broken anonymous API update:
            # the data-feed refresh below is the key-less source.
            refresh_skipped_because='NVD_API_KEY is not configured'
            echo "::warning::NVD_API_KEY is not configured; the NVD API refresh cannot run. Trying the NVD data feed refresh."
          fi

          # The second source. Whatever stopped the key path -- no key, a refused key, an NVD API outage -- the
          # data feeds are fetched without a key and through another code path of Dependency-Check, so the gate
          # does not depend on one secret. A successful feed refresh is a refresh like the other: it writes the
          # sentinel, under its own label, and publishes the cache. Switching between the two sources makes
          # Dependency-Check reload the whole feed once (it records the source it last checked); that costs time,
          # never correctness.
          if [[ -n "${refresh_skipped_because}" ]]; then
            datafeed_log="${RUNNER_TEMP}/dependency-check-datafeed.log"
            if ./mvnw \
              -Pd2-security \
              "-DdataDirectory=${data_dir}" \
              "-DnvdDatafeedUrl=${NVD_DATAFEED_URL}" \
              org.owasp:dependency-check-maven:13.0.0:update-only 2>&1 | tee "${datafeed_log}"; then
              bash ./scripts/write-dependency-check-sentinel.sh \
                "${data_dir}" "${DEPENDENCY_CHECK_PLUGIN_VERSION}" "${DEPENDENCY_CHECK_SCHEMA_VERSION}" "NVD data feed refresh"
              echo "updated=true" >> "${GITHUB_OUTPUT}"
              echo "refresh_age_seconds=0" >> "${GITHUB_OUTPUT}"
              bash ./scripts/report-dependency-check-cache.sh 0 "NVD data feed refresh"
              echo "::warning::MORPHEUS_DEPENDENCY_CHECK_REFRESH=REFRESHED_FROM_DATA_FEED. The database was renewed from the NVD data feeds because the NVD API refresh did not run (${refresh_skipped_because}). The gate is fresh, but it now has one working source: restore NVD_API_KEY to get the second back. See RT-13 in docs/architecture/risks/register.md."
              refresh_skipped_because=''
            else
              echo "::warning::MORPHEUS_DEPENDENCY_CHECK_REFRESH=REFRESH_FAILED. The NVD data feed refresh did not complete either; its cause is in the log of this step. Nothing here refreshed the feed, so this run falls back to the last trusted cache and its freshness budget keeps running from that cache's own refresh, not from now. See docs/developer/COLD_START_RECOVERY.md."
              refresh_skipped_because="${refresh_skipped_because}; the NVD data feed refresh failed"
            fi
          fi

          if [[ -n "${refresh_skipped_because}" ]]; then
            facts="$(bash ./scripts/read-dependency-check-sentinel.sh "${data_dir}" "${DEPENDENCY_CHECK_SCHEMA_VERSION}")"
            status="$(sed -n 's/^status=//p' <<< "${facts}" | head -n 1)"
            if [[ "${status}" != 'OK' ]]; then
              echo "::error::MORPHEUS_DEPENDENCY_CHECK_FAILURE=STALE_DATABASE. No trusted Dependency-Check database is available (${status}): nothing here refreshed the feed (${refresh_skipped_because}), and the restored cache carries no trusted-refresh sentinel to date. Both refresh sources failed in this run: read the update step log, and restore NVD_API_KEY if it is the cause."
              exit 1
            fi
            age_seconds="$(sed -n 's/^ageSeconds=//p' <<< "${facts}" | head -n 1)"
            # Same rule as the pull-request path: the row names the provenance the sentinel recorded, never a
            # literal describing this run. Why this run refreshed nothing is a separate fact, and it is carried
            # by the annotations and the messages below, where a cause belongs.
            refreshed_by="$(sed -n 's/^refreshedBy=//p' <<< "${facts}" | head -n 1)"
            bash ./scripts/report-dependency-check-cache.sh "${age_seconds}" "${refreshed_by:-unknown}"
            if (( age_seconds < 0 || age_seconds > max_age_seconds )); then
              echo "::error::MORPHEUS_DEPENDENCY_CHECK_FAILURE=STALE_DATABASE. Trusted Dependency-Check database is stale (${age_seconds}s since its last trusted refresh; maximum ${max_age_seconds}s), and nothing here refreshed it (${refresh_skipped_because}). Both refresh sources failed in this run: read the update step log, and restore NVD_API_KEY if it is the cause. This is an infrastructure failure, not a vulnerability finding."
              exit 1
            fi
            echo "Dependency-Check trusted cache fallback PASS (${age_seconds}s since its last trusted refresh; maximum ${max_age_seconds}s; ${refresh_skipped_because})."
            echo "refresh_age_seconds=${age_seconds}" >> "${GITHUB_OUTPUT}"
            echo "refresh_cause=${refresh_skipped_because}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Save trusted Dependency-Check database
        if: github.event_name != 'pull_request' && steps.dependency-check-update.outputs.updated == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/dependency-check-data
          key: dependency-check-schema${{ env.DEPENDENCY_CHECK_SCHEMA_VERSION }}-trusted-${{ runner.os }}-${{ github.run_id }}

      - name: Run OWASP Dependency-Check scan
        shell: bash
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP}/dependency-check-product.log"
          if ./mvnw \
            -Pd2-security \
            "-DdataDirectory=${GITHUB_WORKSPACE}/target/dependency-check-data" \
            -DautoUpdate=false \
            org.owasp:dependency-check-maven:13.0.0:aggregate 2>&1 | tee "${log}"; then
            exit 0
          fi
          bash ./scripts/classify-dependency-check-failure.sh "${log}" "product runtime dependencies"

      # The product SBOM and the scan above exclude test scope on purpose: those artifacts are never shipped.
      # They are executed on every machine that builds MORPHEUS, so they get their own fail-closed scan rather
      # than no scan at all. It reuses the trusted database the steps above already prepared, so this second
      # look costs no additional NVD traffic.
      - name: Run OWASP Dependency-Check scan over build and test dependencies
        shell: bash
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP}/dependency-check-build-and-test.log"
          if ./mvnw \
            -Pd2-security-tests \
            "-DdataDirectory=${GITHUB_WORKSPACE}/target/dependency-check-data" \
            -DautoUpdate=false \
            org.owasp:dependency-check-maven:13.0.0:aggregate 2>&1 | tee "${log}"; then
            exit 0
          fi
          bash ./scripts/classify-dependency-check-failure.sh "${log}" "build and test dependencies"

      - name: Upload dependency-check evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-check
          if-no-files-found: warn
          retention-days: 14
          path: |
            target/d2-security/**
            target/d2-security-tests/**

  # A refresh that did not happen is not a refusal, and it must not become one: the scan above already refuses on the
  # freshness budget and only on it. What was missing is that anyone be told before that refusal arrives. Every signal
  # the scan job publishes is an annotation or a summary line on a run that stays green, and a green run notifies
  # nobody; the first thing that reached a person was every pull request failing at once, 72 hours after the last good
  # refresh.
  #
  # So this is a separate job, run after the scan and the upload of its evidence. It is not the scan job: that job's
  # name is a required check of the repository ruleset, and failing it on a scheduled run would put a red check of a
  # required name on the head of main. It is not a step of the update job either: a new `exit 1` there would make a
  # refresh that failed into a refusal. It fails when the run renewed the feed from neither source and either the key
  # half of the cause cannot clear by itself (the NVD refused NVD_API_KEY, or NVD_API_KEY is not configured:
  # REFRESH_KEY_UNUSABLE, in the first run that sees it), or the database it scanned has spent two thirds of its budget
  # (REFRESH_OVERDUE) -- the threshold report-dependency-check-cache.sh already warns at, so the alert and the warning
  # cannot disagree. With a daily schedule a single run in which both sources failed for a transient reason leaves the
  # database well inside that bound and the run stays green; a second consecutive miss crosses it, with about a day
  # left. A run renewed from the data feeds alone raises no alert: the gate is fresh, and the update step names the
  # lost key in its REFRESHED_FROM_DATA_FEED annotation.
  #
  # When the scan job published no age (it failed before, was cancelled, or refused with STALE_DATABASE) the age is
  # unknown: no alert is raised, and the scan job's own conclusion stands.
  refresh-alert:
    name: Dependency-Check refresh alert
    needs: dependency-check
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Raise the alert when the refresh did not happen and the budget is two thirds spent
        shell: bash
        env:
          REFRESHED: ${{ needs.dependency-check.outputs.refreshed }}
          AGE_SECONDS_PUBLISHED: ${{ needs.dependency-check.outputs.refresh_age_seconds }}
          REFRESH_CAUSE: ${{ needs.dependency-check.outputs.refresh_cause }}
        run: |
          age_seconds="${AGE_SECONDS_PUBLISHED:-}"
          if [[ ! "${age_seconds}" =~ ^[0-9]+$ ]]; then
            echo "The scan job published no database age (it failed before, was cancelled, or refused): nothing to alert on here."
            exit 0
          fi
          if [[ "${REFRESHED:-}" == 'true' ]]; then
            echo "The trusted refresh happened in this run: no alert."
            exit 0
          fi

          # A run reaches this point only when both refresh sources failed. When the key path failed because the NVD
          # refuses the key or the key is gone, that half never clears on its own, and the data feeds, the one source
          # left, have just failed too: the two-thirds threshold below would only hand a person the last day of the
          # budget, so these raise the alert in the first run that sees them. The cause strings are the ones the update
          # step publishes, each followed by the data-feed failure. A key path that failed with the key configured may
          # be an NVD outage, a quota or a network cut, so it alone waits for the threshold.
          case "${REFRESH_CAUSE:-}" in
            'NVD_API_KEY was refused by the NVD; '*|'NVD_API_KEY is not configured; '*)
              remaining_hours="$(( (DEPENDENCY_CHECK_MAX_CACHE_AGE_HOURS * 3600 - age_seconds) / 3600 ))"
              echo "::error::MORPHEUS_DEPENDENCY_CHECK_ALERT=REFRESH_KEY_UNUSABLE. This run did not renew the Dependency-Check database (${REFRESH_CAUSE}): the NVD API path cannot work until NVD_API_KEY is restored, and the NVD data feeds, the other source of a branch pinned to Dependency-Check ${DEPENDENCY_CHECK_PLUGIN_VERSION}, failed in this run. About ${remaining_hours}h remain before every scan, including every pull request, fails with STALE_DATABASE. Replace or restore NVD_API_KEY now, and read the update step log for the data-feed failure. See the rotation procedure in docs/developer/COLD_START_RECOVERY.md and RT-13 in docs/architecture/risks/register.md."
              exit 1
              ;;
          esac

          max_age_seconds="$((DEPENDENCY_CHECK_MAX_CACHE_AGE_HOURS * 60 * 60))"
          if (( age_seconds * 3 >= max_age_seconds * 2 )); then
            remaining_hours="$(( (max_age_seconds - age_seconds) / 3600 ))"
            echo "::error::MORPHEUS_DEPENDENCY_CHECK_ALERT=REFRESH_OVERDUE. The Dependency-Check database is $((age_seconds / 3600))h old, about ${remaining_hours}h before every scan, including every pull request, starts failing with STALE_DATABASE, and this run did not renew it (${REFRESH_CAUSE:-cause unknown}). Both refresh sources failed: read the log of the update step. If it shows NVD_API_KEY refused, replace the key; if the API refresh failed with the key configured, do not rotate the key on this evidence alone. See docs/developer/COLD_START_RECOVERY.md and RT-13 in docs/architecture/risks/register.md."
            exit 1
          fi
          echo "The database is ${age_seconds}s old, inside two thirds of its budget (${max_age_seconds}s): no alert."
