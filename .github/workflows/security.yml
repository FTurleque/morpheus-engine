name: MORPHEUS Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morpheus-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-check:
    name: dependency-check (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          check-latest: false

      - name: Restore Dependency-Check database
        id: dependency-check-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/dependency-check-data
          key: dependency-check-v12-trusted-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            dependency-check-v12-trusted-${{ runner.os }}-

      - name: Remove stale Dependency-Check update lock
        shell: bash
        run: |
          lock_file="${GITHUB_WORKSPACE}/target/dependency-check-data/odc.update.lock"
          if [[ -e "${lock_file}" ]]; then
            echo "::warning::Removing stale Dependency-Check update lock restored from cache."
            rm -f -- "${lock_file}"
          fi

      - name: Update Dependency-Check vulnerability database (trusted events)
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          args=(
            "-Pd2-security"
            "-DdataDirectory=${GITHUB_WORKSPACE}/target/dependency-check-data"
            "org.owasp:dependency-check-maven:12.2.2:update-only"
          )
          if [[ -n "${NVD_API_KEY:-}" ]]; then
            args+=("-DnvdApiKeyEnvironmentVariable=NVD_API_KEY")
          else
            echo "::warning::NVD_API_KEY is not configured; a cold NVD update can be slower."
          fi
          ./mvnw "${args[@]}"

      - name: Save trusted Dependency-Check database
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/dependency-check-data
          key: dependency-check-v12-trusted-${{ runner.os }}-${{ github.run_id }}

      - name: Run OWASP Dependency-Check scan
        shell: bash
        run: |
          ./mvnw \
            -Pd2-security \
            "-DdataDirectory=${GITHUB_WORKSPACE}/target/dependency-check-data" \
            -DautoUpdate=false \
            org.owasp:dependency-check-maven:12.2.2:aggregate

      - name: Upload dependency-check evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-check
          if-no-files-found: warn
          retention-days: 14
          path: target/d2-security/**
