name: M1 Bootstrap CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  bootstrap:
    name: Java 21 / Maven Wrapper / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Wrapper and build on Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x mvnw
          ./mvnw --version
          ./mvnw -q help:evaluate -Dexpression=maven.compiler.release -DforceStdout
          ./mvnw -B --no-transfer-progress test

      - name: Verify Wrapper and build on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\mvnw.cmd --version
          .\mvnw.cmd -q help:evaluate "-Dexpression=maven.compiler.release" -DforceStdout
          .\mvnw.cmd -B --no-transfer-progress test
