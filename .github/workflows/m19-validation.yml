name: M19 validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows M19 tests, gates and portable distribution
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Environment
        shell: pwsh
        run: |
          Write-Host "M19_PLATFORM=windows"
          Write-Host "M19_SHA=$env:GITHUB_SHA"
          Write-Host "M19_CPU=$env:NUMBER_OF_PROCESSORS"
          java -version
          .\mvnw.cmd --version

      - name: Full Maven reactor
        shell: pwsh
        run: .\mvnw.cmd clean test

      - name: M19 performance gates
        shell: pwsh
        run: .\mvnw.cmd -pl morpheus-architecture-tests -am -Dtest=M19PerformanceGate -Dsurefire.failIfNoSpecifiedTests=false -DargLine=-Xmx768m test

      - name: Build and smoke-test portable app-image
        shell: pwsh
        run: .\distribution\build-portable.ps1

      - name: Verify Windows archive
        shell: pwsh
        run: |
          $archive = Get-ChildItem .\dist\morpheus-*-windows-x64.zip | Select-Object -First 1
          if ($null -eq $archive) { throw 'Windows portable archive not found' }
          Write-Host "M19_WINDOWS_ARCHIVE=$($archive.FullName)"
          Write-Host "M19_WINDOWS_ARCHIVE_BYTES=$($archive.Length)"

  linux:
    name: Linux M19 tests, gates and portable distribution
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Environment
        run: |
          echo "M19_PLATFORM=linux"
          echo "M19_SHA=$GITHUB_SHA"
          echo "M19_CPU=$(nproc)"
          java -version
          chmod +x mvnw distribution/build-portable.sh
          ./mvnw --version

      - name: Full Maven reactor
        run: ./mvnw clean test

      - name: M19 performance gates
        run: ./mvnw -pl morpheus-architecture-tests -am -Dtest=M19PerformanceGate -Dsurefire.failIfNoSpecifiedTests=false -DargLine=-Xmx768m test

      - name: Build and smoke-test portable app-image
        run: bash distribution/build-portable.sh

      - name: Verify Linux archive
        run: |
          archive=$(find dist -maxdepth 1 -name 'morpheus-*-linux-x64.tar.gz' -print -quit)
          test -n "$archive"
          echo "M19_LINUX_ARCHIVE=$archive"
          echo "M19_LINUX_ARCHIVE_BYTES=$(stat -c%s "$archive")"
