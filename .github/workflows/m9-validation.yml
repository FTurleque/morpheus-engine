name: M9 validation (historical manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows tests and portable distribution
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Full Maven gate
        shell: pwsh
        run: .\mvnw.cmd clean test

      - name: Build and smoke-test portable app-image
        shell: pwsh
        run: .\distribution\build-portable.ps1

      - name: Verify Windows archive
        shell: pwsh
        run: |
          $archive = Get-ChildItem .\dist\morpheus-*-windows-x64.zip | Select-Object -First 1
          if ($null -eq $archive) { throw 'Windows portable archive not found' }
          Write-Host $archive.FullName

      - name: Evaluate Windows installer prerequisite
        shell: pwsh
        run: |
          $wix = Get-Command candle.exe -ErrorAction SilentlyContinue
          if ($null -eq $wix) {
            Write-Host 'WiX not present: EXE/MSI packaging remains optional; portable app-image is the M9 gate.'
          } else {
            Write-Host "WiX available at $($wix.Source)"
          }

  linux:
    name: Linux tests and portable distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Full Maven gate
        run: |
          chmod +x mvnw
          ./mvnw clean test

      - name: Build and smoke-test portable app-image
        run: bash distribution/build-portable.sh

      - name: Verify Linux archive
        run: test -f dist/morpheus-*-linux-x64.tar.gz
