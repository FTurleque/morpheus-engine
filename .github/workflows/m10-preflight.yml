name: M10 MCP preflight

on:
  push:
    branches:
      - m10/mcp-server
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Maven gate
        run: ./mvnw clean test
