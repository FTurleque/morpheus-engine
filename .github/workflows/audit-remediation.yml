name: MORPHEUS Audit Remediation Patch

on:
  push:
    branches: [agent/fix-audit-20260813-2]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout remediation head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          check-latest: false

      - name: Apply audited source patches
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          def replace_count(path, old, new, expected):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {count}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'morpheus-api/src/main/java/com/morpheus/api/MorpheusHttpServer.java',
              '''        } catch (RuntimeException ignored) {
                      return "GET";
                  }
                  if (segments.size() == 1 && (segments.getFirst().equals("projects") || segments.getFirst().equals("portfolios"))) {''',
              '''        } catch (RuntimeException ignored) {
                      return "GET";
                  }
                  if (segments.isEmpty()) {
                      return "GET";
                  }
                  if (segments.size() == 1 && (segments.getFirst().equals("projects") || segments.getFirst().equals("portfolios"))) {''')

          for reader in (
              'morpheus-provider-openspec/src/main/java/com/morpheus/provider/openspec/OpenSpecCurrentSpecificationReader.java',
              'morpheus-provider-openspec/src/main/java/com/morpheus/provider/openspec/OpenSpecRequirementDeltaReader.java',
          ):
              replace_count(reader, 'Files.walk(specsRoot)', 'OpenSpecBoundedTraversal.walk(specsRoot)', 1)

          replace_once('README.md', 'Version produit       1.2.0',
                       'Release stable        1.2.0\nBaseline développement 1.2.1')
          replace_once('README.md', '.\\scripts\\validate.cmd d2 -Version 1.2.0 -BaseRef origin/develop',
                       '.\\scripts\\validate.cmd d2 -Version 1.2.1 -BaseRef origin/develop')
          replace_once('README.md', 'MORPHEUS_D2_BASE_REF=origin/develop bash ./scripts/validate-d2.sh 1.2.0',
                       'MORPHEUS_D2_BASE_REF=origin/develop bash ./scripts/validate-d2.sh 1.2.1')
          replace_once(
              'README.md',
              '**D2 n’utilise aucune CI** : aucun workflow GitHub Actions n’est inspecté, modifié, relancé ou utilisé comme preuve.',
              'Le gate **D2 reste une qualification locale distincte** ; les workflows `MORPHEUS CI` et `MORPHEUS Security` constituent des défenses complémentaires et ne remplacent pas la preuve D2.')

          portable = Path('distribution/build-portable.ps1')
          text = portable.read_text(encoding='utf-8')
          start = text.find('function Test-PackagedApiOperability {')
          end = text.find('Write-Host "Building MORPHEUS', start)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('distribution/build-portable.ps1: Test-PackagedApiOperability block markers not found')
          replacement = r'''function Get-PackagedApiProbe {
              param([Parameter(Mandatory = $true)][int]$Port)
              $baseUri = "http://127.0.0.1:$Port/api/v1"
              $health = Invoke-WebRequest -Uri "$baseUri/health" -UseBasicParsing -TimeoutSec 2 -ErrorAction Stop
              $readiness = Invoke-WebRequest -Uri "$baseUri/readiness" -UseBasicParsing -TimeoutSec 2 -ErrorAction Stop
              $metrics = Invoke-WebRequest -Uri "$baseUri/metrics" -UseBasicParsing -TimeoutSec 2 -ErrorAction Stop
              $versionResponse = Invoke-WebRequest -Uri "$baseUri/version" -UseBasicParsing -TimeoutSec 2 -ErrorAction Stop
              $versionPayload = $versionResponse.Content | ConvertFrom-Json
              return [pscustomobject]@{
                  HealthStatus = $health.StatusCode
                  HealthBody = $health.Content
                  ReadinessStatus = $readiness.StatusCode
                  ReadinessBody = $readiness.Content
                  MetricsStatus = $metrics.StatusCode
                  MetricsBody = $metrics.Content
                  VersionStatus = $versionResponse.StatusCode
                  Version = [string]$versionPayload.data.version
              }
          }

          function Test-PackagedApiProbe {
              param([Parameter(Mandatory = $true)]$Probe)
              return $Probe.HealthStatus -eq 200 -and $Probe.HealthBody -match '"status":"UP"' `
                  -and $Probe.ReadinessStatus -eq 200 -and $Probe.ReadinessBody -match '"status":"READY"' `
                  -and $Probe.MetricsStatus -eq 200 -and $Probe.MetricsBody -match '"counters"' `
                  -and $Probe.VersionStatus -eq 200 -and $Probe.Version -eq $Version
          }

          function Test-PackagedApiOperability {
              param([Parameter(Mandatory = $true)][string]$Launcher,
                    [Parameter(Mandatory = $true)][string]$WorkDirectory)
              $port = Get-FreeLoopbackPort
              $apiData = Join-Path $WorkDirectory "api-smoke-data"
              $stdout = Join-Path $WorkDirectory "api-smoke.stdout.log"
              $stderr = Join-Path $WorkDirectory "api-smoke.stderr.log"
              New-Item $apiData -ItemType Directory -Force | Out-Null
              Remove-Item $stdout, $stderr -Force -ErrorAction SilentlyContinue
              $process = Start-Process -FilePath $Launcher `
                  -ArgumentList @("--data-dir", $apiData, "api", "--host", "127.0.0.1", "--port", "$port") `
                  -RedirectStandardOutput $stdout -RedirectStandardError $stderr -WindowStyle Hidden -PassThru
              try {
                  for ($attempt = 1; $attempt -le 60; $attempt++) {
                      if ($process.HasExited) {
                          $diagnostic = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { "" }
                          throw "Packaged API exited before health check. stderr=$diagnostic"
                      }
                      try {
                          $probe = Get-PackagedApiProbe -Port $port
                          if (Test-PackagedApiProbe -Probe $probe) {
                              Write-Output "Packaged API health/readiness/metrics/version smoke: PASS (http://127.0.0.1:$port/api/v1)"
                              return
                          }
                      } catch {
                          Write-Verbose "Packaged API probe attempt $attempt failed: $($_.Exception.Message)"
                      }
                      Start-Sleep -Milliseconds 100
                  }
                  $diagnostic = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { "" }
                  throw "Packaged API operability/version smoke timed out. stderr=$diagnostic"
              } finally {
                  if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
                  try {
                      $process.WaitForExit(5000) | Out-Null
                  } catch {
                      Write-Verbose "Packaged API process wait failed during cleanup: $($_.Exception.Message)"
                  }
                  Start-Sleep -Milliseconds 300
              }
          }

          '''
          portable.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

      - name: Commit patched sources locally
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md distribution/build-portable.ps1 \
            morpheus-api/src/main/java/com/morpheus/api/MorpheusHttpServer.java \
            morpheus-provider-openspec/src/main/java/com/morpheus/provider/openspec/OpenSpecCurrentSpecificationReader.java \
            morpheus-provider-openspec/src/main/java/com/morpheus/provider/openspec/OpenSpecRequirementDeltaReader.java
          git diff --cached --quiet && { echo 'Expected remediation patch produced no changes' >&2; exit 1; }
          git commit -m 'fix: close API provider and documentation audit findings'

      - name: Validate patched modules
        shell: bash
        run: ./mvnw -B -pl morpheus-store-sqlite,morpheus-provider-openspec,morpheus-api -am test

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failures = @()
          foreach ($path in @('scripts/validate-m21.ps1', 'distribution/build-portable.ps1', 'distribution/build-installer.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { $failures += $errors }
          }
          if ($failures.Count -gt 0) { throw ($failures | Out-String) }

      - name: Push validated patch
        shell: bash
        run: git push origin HEAD:agent/fix-audit-20260813-2
