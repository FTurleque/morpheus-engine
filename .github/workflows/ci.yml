name: MORPHEUS CI

on:
  pull_request:
  push:
    branches:
      - m17/controlled-lifecycle-write-operations
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morpheus-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner-smoke:
    name: Runner — basic shell smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify hosted runner execution
        run: |
          echo "runner=$RUNNER_OS"
          uname -a

  linux-tests:
    name: Linux — Maven clean test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ensure Maven Wrapper is executable
        run: chmod +x mvnw

      - name: Run full Maven reactor
        shell: bash
        run: |
          mkdir -p .ci-logs
          set -o pipefail
          {
            java -version
            ./mvnw --version
            ./mvnw -B -ntp clean test
          } 2>&1 | tee .ci-logs/linux-maven.log

      - name: Upload Linux validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-maven-log
          path: .ci-logs/linux-maven.log
          if-no-files-found: warn
          retention-days: 7

  windows-validation:
    name: Windows — M17 full validation
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run M17 validator
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path .ci-logs | Out-Null
          & .\validate-m17.cmd -SkipUpdate *> .ci-logs\windows-validation.log
          $exitCode = $LASTEXITCODE
          Get-Content .ci-logs\windows-validation.log
          exit $exitCode

      - name: Upload Windows validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-m17-validation-log
          path: .ci-logs/windows-validation.log
          if-no-files-found: warn
          retention-days: 7
