name: MORPHEUS CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morpheus-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: exact-head (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Refuse direct develop promotion
        if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'develop'
        run: |
          echo "::error::Do not merge develop directly into main while delete_branch_on_merge is enabled. Create a temporary promotion branch from develop instead."
          exit 1

      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          check-latest: false

      - name: Run one-command M21 gate on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: bash ./scripts/validate-m21.sh 1.2.1

      - name: Enforce changed line and branch coverage on Linux PRs
        if: runner.os == 'Linux' && github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          case "$BASE_REF" in
            develop)
              git diff --unified=0 --no-color origin/develop...HEAD -- |
                python3 scripts/check-diff-coverage.py --minimum 0.80 --minimum-branch 0.70
              ;;
            main)
              git diff --unified=0 --no-color origin/main...HEAD -- |
                python3 scripts/check-diff-coverage.py --minimum 0.80 --minimum-branch 0.70
              ;;
            *)
              echo "::error::Unsupported pull-request base branch"
              exit 2
              ;;
          esac

      - name: Run one-command M21 gate on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\validate.cmd m21 -Version 1.2.1

      - name: Upload M21 integrity evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m21-integrity-${{ runner.os }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            **/target/surefire-reports/*.xml
            **/target/site/jacoco/jacoco.xml
            morpheus-architecture-tests/target/m21-coverage-summary.txt
            target/m21-supply-chain/**
            validation-output/m21/validation-summary.txt
            validation-output/m21/diff-coverage.txt
            validation-output/m21/api.stdout.log
            validation-output/m21/api.stderr.log
