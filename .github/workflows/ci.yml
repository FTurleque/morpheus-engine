name: MORPHEUS CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morpheus-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: exact-head (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Refuse direct develop promotion
        if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'develop'
        run: |
          echo "::error::Do not merge develop directly into main while delete_branch_on_merge is enabled. Create a temporary promotion branch from develop instead."
          exit 1

      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          check-latest: false

      - name: Diagnose existing Sonar reliability issues
        if: >-
          runner.os == 'Linux' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "::error::SONAR_TOKEN is required for Sonar reliability diagnostics"
            exit 1
          fi
          echo "Existing Sonar reliability issues for PR #${PR_NUMBER}:"
          curl --fail --silent --show-error --user "${SONAR_TOKEN}:" --get \
            'https://sonarcloud.io/api/issues/search' \
            --data-urlencode 'componentKeys=FTurleque_morpheus-engine' \
            --data-urlencode "pullRequest=${PR_NUMBER}" \
            --data-urlencode 'resolved=false' \
            --data-urlencode 'ps=100' |
            python3 -c 'import json,sys; p=json.load(sys.stdin); issues=[i for i in p.get("issues",[]) if i.get("type")=="BUG" or any(x.get("softwareQuality")=="RELIABILITY" for x in i.get("impacts",[]))]; [print(json.dumps({"key":i.get("key"),"rule":i.get("rule"),"component":i.get("component"),"line":i.get("line"),"message":i.get("message"),"severity":i.get("severity"),"impacts":i.get("impacts")}, ensure_ascii=False)) for i in issues]' |
            tee sonar-reliability-diagnostics.jsonl

      - name: Upload Sonar reliability diagnostics
        if: runner.os == 'Linux' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonar-reliability-diagnostics
          if-no-files-found: error
          retention-days: 1
          path: sonar-reliability-diagnostics.jsonl

      - name: Run one-command M21 gate on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: bash ./scripts/validate-m21.sh 1.2.1

      - name: Enforce changed line and branch coverage on Linux PRs
        if: runner.os == 'Linux' && github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          case "$BASE_REF" in
            develop)
              git diff --unified=0 --no-color origin/develop...HEAD -- |
                python3 scripts/check-diff-coverage.py --minimum 0.80 --minimum-branch 0.70
              ;;
            main)
              git diff --unified=0 --no-color origin/main...HEAD -- |
                python3 scripts/check-diff-coverage.py --minimum 0.80 --minimum-branch 0.70
              ;;
            *)
              echo "::error::Unsupported pull-request base branch"
              exit 2
              ;;
          esac

      - name: Run SonarQube Cloud CI analysis with JaCoCo
        if: >-
          runner.os == 'Linux' &&
          (github.event_name == 'push' ||
           (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository))
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "::error::SONAR_TOKEN is required for SonarQube Cloud CI analysis"
            exit 1
          fi
          reports="$(find "$GITHUB_WORKSPACE" -type f -path '*/target/site/jacoco/jacoco.xml' -print | sort | paste -sd, -)"
          if [ -z "$reports" ]; then
            echo "::error::No JaCoCo XML reports were produced by the exact-head M21 gate"
            exit 1
          fi
          set +e
          ./mvnw -B -ntp -DskipTests -Djacoco.skip=true \
            -Dsonar.projectKey=FTurleque_morpheus-engine \
            -Dsonar.organization=fturleque \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.coverage.jacoco.xmlReportPaths="$reports" \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.5.0.6356:sonar
          sonar_status=$?
          set -e
          if [ "$sonar_status" -ne 0 ] && [ -n "${PR_NUMBER:-}" ]; then
            echo "Sonar reliability diagnostics for PR #${PR_NUMBER}:"
            curl --fail --silent --show-error --user "${SONAR_TOKEN}:" --get \
              'https://sonarcloud.io/api/issues/search' \
              --data-urlencode 'componentKeys=FTurleque_morpheus-engine' \
              --data-urlencode "pullRequest=${PR_NUMBER}" \
              --data-urlencode 'resolved=false' \
              --data-urlencode 'ps=100' |
              python3 -c 'import json,sys; p=json.load(sys.stdin); issues=[i for i in p.get("issues",[]) if i.get("type")=="BUG" or any(x.get("softwareQuality")=="RELIABILITY" for x in i.get("impacts",[]))]; [print(json.dumps({"key":i.get("key"),"rule":i.get("rule"),"component":i.get("component"),"line":i.get("line"),"message":i.get("message"),"severity":i.get("severity"),"impacts":i.get("impacts")}, ensure_ascii=False)) for i in issues]'
          fi
          exit "$sonar_status"

      - name: Run one-command M21 gate on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\validate.cmd m21 -Version 1.2.1

      - name: Upload M21 integrity evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m21-integrity-${{ runner.os }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            **/target/surefire-reports/*.xml
            **/target/site/jacoco/jacoco.xml
            morpheus-architecture-tests/target/m21-coverage-summary.txt
            target/m21-supply-chain/**
            validation-output/m21/validation-summary.txt
            validation-output/m21/diff-coverage.txt
            validation-output/m21/api.stdout.log
            validation-output/m21/api.stderr.log
