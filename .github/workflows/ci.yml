name: MORPHEUS CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morpheus-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: exact-head (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          check-latest: false

      - name: Run one-command M21 gate on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: bash ./scripts/validate-m21.sh 1.2.0

      - name: Run one-command M21 gate on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\validate.cmd m21 -Version 1.2.0

      - name: Upload M21 integrity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m21-integrity-${{ runner.os }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            **/target/surefire-reports/*.xml
            **/target/site/jacoco/jacoco.xml
            morpheus-architecture-tests/target/m21-coverage-summary.txt
            target/m21-supply-chain/**
            validation-output/m21/validation-summary.txt
            validation-output/m21/api.stdout.log
            validation-output/m21/api.stderr.log
