name: MORPHEUS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morpheus-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          check-latest: false

      - name: Enable Maven Wrapper on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: chmod +x mvnw scripts/*.sh distribution/*.sh

      - name: Verify full reactor on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: ./mvnw -B -ntp -Dstyle.color=never clean verify

      - name: Verify full reactor on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\mvnw.cmd -B -ntp -Dstyle.color=never clean verify

      - name: Write Linux provenance
        if: runner.os == 'Linux' && success()
        shell: bash
        run: ./scripts/write-build-provenance.sh

      - name: Write Windows provenance
        if: runner.os == 'Windows' && success()
        shell: pwsh
        run: .\scripts\write-build-provenance.ps1

      - name: Upload M21 integrity evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m21-integrity-${{ runner.os }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            **/target/surefire-reports/*.xml
            **/target/site/jacoco/jacoco.xml
            morpheus-architecture-tests/target/m21-coverage-summary.txt
            target/m21-supply-chain/**
