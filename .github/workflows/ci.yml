name: MORPHEUS CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morpheus-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: exact-head (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          check-latest: false

      - name: Run one-command M21 gate on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: bash ./scripts/validate-m21.sh 1.2.1

      - name: Enforce changed line and branch coverage on Linux PRs
        if: runner.os == 'Linux' && github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          case "$BASE_REF" in
            develop)
              git diff --unified=0 --no-color origin/develop...HEAD -- |
                python3 scripts/check-diff-coverage.py --minimum 0.80 --minimum-branch 0.70
              ;;
            main)
              git diff --unified=0 --no-color origin/main...HEAD -- |
                python3 scripts/check-diff-coverage.py --minimum 0.80 --minimum-branch 0.70
              ;;
            *)
              echo "::error::Unsupported pull-request base branch"
              exit 2
              ;;
          esac

      # scripts\validate-m28.ps1 chains M28 -> R2 -> M27 only (median 15.7 minutes of runner time end to
      # end, measured over 21 runs on 10/09/2026; an earlier "~8 minutes" figure had drifted to half the
      # real cost. One `mvnw clean verify`, the M22-M27/M28 contract/convergence checks, and both real
      # Windows installer builds plus their lifecycle/MCP-smoke verification against the actually
      # compiled Setup.exe) -- it
      # does not re-run every earlier milestone's own reactor pass, so running it here is not the redundant
      # historical chain that would be disproportionate for a PR. It replaces the old M21-only gate: M28's
      # own chain already runs M27's full reactor verify, so a separate M21-only step would just repeat that
      # build. A wiring regression in MORPHEUS.iss's wizard/detection/transactional-upgrade/uninstall path
      # is caught here, on every PR, not only at release time.
      - name: Run full M28 gate on Windows (Setup.exe wizard, transactional upgrade, MCP smoke)
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\validate-m28.ps1 -Version 1.2.1

      - name: Upload M21 integrity evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m21-integrity-${{ runner.os }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            **/target/surefire-reports/*.xml
            **/target/site/jacoco/jacoco.xml
            morpheus-coverage-report/target/site/jacoco-aggregate/jacoco.xml
            morpheus-architecture-tests/target/m21-per-module-coverage-summary.txt
            morpheus-architecture-tests/target/m21-aggregate-coverage-summary.txt
            target/m21-supply-chain/**
            validation-output/m21/validation-summary.txt
            validation-output/m21/diff-coverage.txt
            validation-output/m21/api.stdout.log
            validation-output/m21/api.stderr.log
            validation-output/m28/validation-summary.txt

  sonar:
    # SONAR_TOKEN is a durable secret. It must never be present in the environment of a build that compiles or
    # executes code from a not-yet-merged pull request -- including an internal branch of this repository, which
    # actions/checkout with a pull_request ref would otherwise hand this secret alongside. A contributor able to
    # push a branch here could change pom.xml, .mvn/**, mvnw, or a plugin execution and have that code run with
    # SONAR_TOKEN in scope. Fork and Dependabot pull requests already withhold secrets by default; this job closes
    # the internal-branch gap by never running for pull_request at all. Analysis instead runs only after a push
    # lands on main, i.e. only for code that already passed every required check and any review policy in place.
    # This job intentionally is not a required status check (see the branch protection ruleset): its result is a
    # trusted-context quality signal, not a merge gate. A genuine Sonar Quality Gate ERROR still fails this job;
    # a successfully processed analysis for which SonarQube Cloud returns NONE / "Quality Gate not computed" is
    # classified separately as an external indeterminate state so it cannot masquerade as a MORPHEUS regression.
    #
    # This job covers `main` only, and a push to main is rare -- it is a promotion. `develop` accumulates every
    # merge in between, so restricting analysis to this job left the integration branch with no verdict at all
    # until promotion time. That gap is closed by the sonar-develop job in .github/workflows/nightly.yml, on a
    # bounded daily cadence rather than per merge; the trigger reasoning above is why it lives in a workflow with
    # no pull_request trigger instead of being widened here.
    name: SonarQube Cloud Analysis
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          check-latest: false

      - name: Build and test the full reactor for coverage
        shell: bash
        run: ./mvnw -B -ntp clean verify

      - name: Run SonarQube Cloud CI analysis with JaCoCo
        id: sonar_scan
        continue-on-error: true
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "::error::SONAR_TOKEN is required for SonarQube Cloud CI analysis"
            exit 1
          fi
          aggregate="$GITHUB_WORKSPACE/morpheus-coverage-report/target/site/jacoco-aggregate/jacoco.xml"
          if [ -s "$aggregate" ]; then
            reports="$aggregate"
          else
            reports="$(find "$GITHUB_WORKSPACE" -type f -path '*/target/site/jacoco/jacoco.xml' -print | sort | paste -sd, -)"
          fi
          if [ -z "$reports" ]; then
            echo "::error::No JaCoCo XML reports were produced by the reactor build"
            exit 1
          fi
          ./mvnw -B -ntp -DskipTests -Djacoco.skip=true \
            -Dsonar.projectKey=FTurleque_morpheus-engine \
            -Dsonar.organization=fturleque \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.coverage.jacoco.xmlReportPaths="$reports" \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.5.0.6356:sonar

      - name: Classify failed Sonar scanner outcome
        if: steps.sonar_scan.outcome == 'failure'
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: bash ./scripts/classify-sonar-quality-gate.sh
