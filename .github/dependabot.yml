version: 2
updates:
  - package-ecosystem: maven
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    # CodeQL refuses an analyze step whose version differs from the init step's configuration, so a bump that
    # moves one without the other can never pass. One group, one pull request.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
